title: 우아펫케어 - 전국 펫샵·애견호텔·애견유치원 찾기
description: >-
  전국 펫샵·애견호텔·애견유치원·애견카페(동물판매업·동물위탁관리업)의 주소와 전화번호를 동네별로 확인하세요.
url: "https://wooapetcare.wooahouse.com"
baseurl: ""
lang: ko
timezone: Asia/Seoul
author: WooaHouse

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - data/
  - "*.py"
  - "*.log"
  - README.md
  - .gitignore
  - .env
  - vendor/
  - _rawdata/

# 설계 메모: 행안부 LOCALDATA 동물판매업·동물위탁관리업 인허가 CSV(영업/정상)를 가공한 _rawdata/pc_{시도}.json 으로
# 시도→시군구→동 허브 + 종류×(시도/시군구/동) 허브 + 시설 상세를 생성한다. 사이트맵은 pc_generator.rb 분할본.
